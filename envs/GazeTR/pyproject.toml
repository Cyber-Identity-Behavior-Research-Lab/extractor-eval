[project]
name = "gazetr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "extractor-eval",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

# PyTorch CUDA 12.6 wheels (driver 580 supports up to CUDA 13.0; cu126 keeps sm_75 / RTX 2080 SUPER support).
# explicit = true: only torch and torchvision come from this index.
# The repo was built with torch 1.7.0 but doesn't require it; plain PyTorch code, so torch 2.x is used.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
extractor-eval = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
