[project]
name = "py-feat-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "celluloid>=0.2.0",
    "easing-functions>=1.0.4",
    "extractor-eval",
    "h5py>=2.7.0",
    "huggingface-hub>=2.2.0",
    "joblib>=1.6.0",
    "numexpr>=2.8.5",
    "numpy>=1.24",
    "opencv-python>=5.0.0.93",
    "pandas>=2.0",
    "pillow>=6.0.0",
    "plotly>=7.1.0",
    "py-feat",
    "safetensors>=0.8.0",
    "scikit-image>=0.19",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "seaborn>=0.13.0",
    "skops>=0.16.0",
    "timm>=1.0.11",
    "torch>=2.14.1",
    "torchcodec>=0.11",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "xgboost>=1.6.0",
]

# PyTorch CUDA 12.6 wheels (driver 580 supports up to CUDA 13.0; cu126 keeps sm_75 / RTX 2080 SUPER support).
# explicit = true: only torch and torchvision come from this index.
# The repo requires torch>=2.5, torchvision>=0.20; same versions as the other envs.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
py-feat = { path = "../../models/Py-Feat", editable = true }
extractor-eval = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
