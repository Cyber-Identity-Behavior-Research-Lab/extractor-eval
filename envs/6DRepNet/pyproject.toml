[project]
name = "6drepnet"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "extractor-eval",
    "matplotlib>=3.3.4",
    "numpy>=1.19.5",
    "opencv-python>=4.5.5",
    "pandas>=1.1.5",
    "pillow>=8.4.0",
    "scipy>=1.5.4",
    "sixdrepnet",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

# PyTorch CUDA 12.6 wheels (driver 580 supports up to CUDA 13.0; cu126 keeps sm_75 / RTX 2080 SUPER support).
# explicit = true: only torch and torchvision come from this index.
# The repo only sets minimums (torch>=1.10.1, torchvision>=0.11.2).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
sixdrepnet = { path = "../../models/6DRepNet", editable = true }
extractor-eval = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
