[project]
name = "openface-3-0"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "extractor-eval",
    "openface-test==0.1.26",
    # pyarrow 26 requires numpy >= 2; openface-test pins numpy 1.26.4. Its wheels declare no numpy dependency, so uv cannot catch this.
    "pyarrow<26",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

# PyTorch CUDA 12.6 wheels (driver 580 supports up to CUDA 13.0; cu126 keeps sm_75 / RTX 2080 SUPER support).
# explicit = true: only torch and torchvision come from this index.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
extractor-eval = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
