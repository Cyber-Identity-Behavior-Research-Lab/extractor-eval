[project]
name = "pyafar"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "dlib-bin==19.24.6",
    "extractor-eval",
    "jax==0.4.30",
    "mediapipe==0.10.21",
    "nvidia-cublas-cu11==11.11.3.6",
    "nvidia-cuda-runtime-cu11==11.8.89",
    "nvidia-cudnn-cu11==8.6.0.163",
    "nvidia-cufft-cu11==10.9.0.58",
    "nvidia-curand-cu11==10.3.0.86",
    "nvidia-cusolver-cu11==11.4.1.48",
    "nvidia-cusparse-cu11==11.7.5.86",
    "opencv-python==4.11.0.86",
    "pyafar-gpu",
    "scipy>=1.15.3",
]

[tool.uv.sources]
pyafar-gpu = { url = "https://github.com/AffectAnalysisGroup/PyAFAR/releases/download/v4.0.0/PyAFAR_GPU-4.0-py3-none-any.whl" }
extractor-eval = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
