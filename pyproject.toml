[project]
name = "extractor-eval"
version = "0.1.0"
description = "Shared helpers (src/) for the MuSES feature extractor evaluation"
requires-python = ">=3.10"
# Kept unpinned so each model env's own pins win.
# opencv (cv2) is required by src/clip_io.py but is not listed here: every model env
# already provides it, sometimes as opencv-contrib-python, and listing opencv-python
# would install a second, conflicting cv2.
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

